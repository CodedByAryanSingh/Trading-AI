services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://trading:trading@db:5432/trading_ai
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - MT5_ENABLED=${MT5_ENABLED:-false}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trading-ai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trading-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - trading-ai-network

  db:
    image: postgres:15-alpine
    container_name: trading-ai-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=trading
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-trading}
      - POSTGRES_DB=trading_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trading-ai-network

volumes:
  postgres_data:

networks:
  trading-ai-network:
    driver: bridge
